<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirect</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: #262626;
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: 24px;
      }

      #loadingGif {
        width: 400px;
        height: auto;
        margin-bottom: 20px;
      }

      #loadingText {
        font-size: 45px;
      }

      #progressBarTrack {
        width: 260px;
        height: 4px;
        margin-top: 20px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }

      #progressBarFill {
        width: 0%;
        height: 100%;
        border-radius: 2px;
        background: #f5f5f5;
        transition: width linear;
      }
    </style>
  </head>
  <body>
    <img id="loadingGif" src="./loading.gif" alt="" />
    <div id="loadingText">Загрузка...</div>
    <div id="progressBarTrack">
      <div id="progressBarFill"></div>
    </div>

    <script>
      const REDIRECT_DELAY_MS = 3000;

      console.log("[Redirect] Страница загружена, адрес: " + window.location.href);
      console.log("[Redirect] Жду " + (REDIRECT_DELAY_MS / 1000) + " секунды перед проверкой параметра url_redirect...");

      const progressBarFill = document.getElementById("progressBarFill");
      progressBarFill.style.transitionDuration = REDIRECT_DELAY_MS + "ms";
      requestAnimationFrame(function () {
        progressBarFill.style.width = "100%";
      });

      setTimeout(function () {
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get("url_redirect");

        console.log("[Redirect] Проверка параметров завершена. Значение url_redirect: " + redirectUrl);

        if (!redirectUrl) {
          console.log("[Redirect] Параметр url_redirect не найден — ничего не делаю");
          return;
        }

        console.log("[Redirect] Перехожу по адресу в этом же окне: " + redirectUrl);

        window.location.href = redirectUrl;
      }, REDIRECT_DELAY_MS);
    </script>
  </body>
</html>
