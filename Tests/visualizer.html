<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify-панель — тестовая страница</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101010;
    --panel: #1b1b1b;
    --field: #292929;
    --text: #f4f4f4;
    --muted: #a7a7a7;
    --accent: #1ed760;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px;
    background: #0b0b0b; color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .layout {
    width: min(1120px, 100%); margin: 0 auto;
    display: grid; grid-template-columns: minmax(260px, 340px) minmax(280px, 400px);
    justify-content: center; align-items: start; gap: 32px;
  }
  .settings {
    padding: 22px; border: 1px solid #303030; border-radius: 16px;
    background: #171717; position: sticky; top: 24px;
  }
  h1 { font-size: 19px; margin: 0 0 7px; }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 22px; }
  label { display: block; margin: 15px 0 7px; font-weight: 650; }
  input[type="url"], input[type="number"], input[type="text"], textarea {
    width: 100%; color: var(--text); background: var(--field);
    border: 1px solid #414141; border-radius: 8px; padding: 11px 12px;
    font: inherit; outline: none;
  }
  input:focus, textarea:focus { border-color: #777; }
  .times { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  textarea { min-height: 76px; resize: vertical; }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 20px; padding: 13px 0; border-top: 1px solid #333;
  }
  .toggle-row label { margin: 0; }
  input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; }
  button {
    border: 0; border-radius: 999px; padding: 11px 18px; margin-top: 12px;
    width: 100%; background: var(--accent); color: #07190d;
    font: 750 14px system-ui, sans-serif; cursor: pointer;
  }
  button:hover { filter: brightness(1.07); }
  .secondary { background: #333; color: #fff; }
  .status { color: var(--muted); font-size: 12px; min-height: 18px; margin-top: 10px; }
  .preview-wrap { width: 100%; }
  .preview-heading { color: #aaa; font-size: 12px; margin: 0 0 10px 3px; }
  .spotify-card {
    position: relative; overflow: hidden; isolation: isolate;
    width: 100%; aspect-ratio: 0.49; min-height: 580px; max-height: 820px;
    border-radius: 9px; background: #111;
    box-shadow: 0 16px 55px #0009; border: 1px solid #252525;
  }.visual {
  position: absolute;
  inset: 0 0 26% 0;
  background: #090909;
  overflow: hidden;
}

#player {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  top: 0;
  border: 0;
  pointer-events: none;
  overflow: hidden;
}

/* Масштабируем само iframe, а не только его контейнер */
#player iframe {
  position: absolute;
  width: 100%;
  height: 100%;
  border: 0;
}
  .visual::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      rgba(0,0,0,.04) 48%,
      rgba(12,12,12,.20) 65%,
      rgba(16,16,16,.75) 82%,
      #171717 100%);
    pointer-events: none;
  }
  .track-info {
    position: absolute; z-index: 2; left: 0; right: 0; bottom: 0;
    min-height: 31%; padding: 22px 20px 24px;
    background: linear-gradient(to bottom, rgba(23,23,23,0) 0%, #171717 24%, #171717 100%);
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .track-text {
    margin: 0; color: #f4f4f4; font-size: clamp(17px, 2.6vw, 23px);
    line-height: 1.35; font-weight: 700; letter-spacing: -.25px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .placeholder {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #555; font-size: 13px; text-align: center; padding: 20px;
    background: radial-gradient(ellipse at 50% 35%, #18351d 0%, #0d120e 38%, #090909 75%);
  }
  @media (max-width: 720px) {
    body { padding: 14px; }
    .layout { grid-template-columns: 1fr; gap: 24px; max-width: 430px; }
    .settings { position: static; }
    .preview-wrap { max-width: 400px; margin: 0 auto; }
    .spotify-card { min-height: 600px; }
  }
</style>
</head>
<body>
<div class="layout">
  <section class="settings" aria-label="Настройки визуализации">
    <h1>Настройки панели</h1>
    <p class="hint">Параметры сохраняются в этом браузере автоматически. Открывайте страницу через localhost, а не напрямую как file:// — YouTube может выдавать ошибку 153.</p>

    <label for="videoUrl">Ссылка на YouTube</label>
    <input id="videoUrl" type="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="url">

    <div class="times">
      <div>
        <label for="startTime">Секунда от</label>
        <input id="startTime" type="number" min="0" step="0.1" value="15">
      </div>
      <div>
        <label for="endTime">Секунда до</label>
        <input id="endTime" type="number" min="0.1" step="0.1" value="26">
      </div>
    </div>

    <label for="trackText">Текст под видео</label>
    <textarea id="trackText" placeholder="Введите любой текст для отображения под видео"></textarea>

    <div class="toggle-row">
      <label for="visualEnabled">Визуализация включена</label>
      <input id="visualEnabled" type="checkbox" checked>
    </div>
    <button id="applyBtn">Применить настройки</button>
    <button id="resetBtn" class="secondary">Сбросить настройки</button>
    <div id="status" class="status" role="status">Ожидание ссылки на видео.</div>
  </section>

  <section class="preview-wrap">
    <p class="preview-heading">Предпросмотр</p>
    <div class="spotify-card">
      <div class="visual">
        <div id="placeholder" class="placeholder">Вставьте ссылку на YouTube<br>и нажмите «Применить настройки»</div>
        <div id="player"></div>
      </div>
      <div class="track-info">
        <p id="previewText" class="track-text">Текст появится здесь</p>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  const STORAGE_KEY = "spotifyLikeVisualizerSettings.v1";
  const $ = id => document.getElementById(id);
  const fields = ["videoUrl", "startTime", "endTime", "trackText", "visualEnabled"];
  let player = null;
  let playerReady = false;
  let currentVideoId = "";
  let loopTimer = null;
  let applied = false;
  let lastSettings = null;

  const defaults = {
    videoUrl: "", startTime: "15", endTime: "26",
    trackText: "", visualEnabled: true
  };

  function readForm() {
    return {
      videoUrl: $("videoUrl").value.trim(),
      startTime: $("startTime").value,
      endTime: $("endTime").value,
      trackText: $("trackText").value,
      visualEnabled: $("visualEnabled").checked
    };
  }

  function save(settings) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (_) {}
  }

  function load() {
    try {
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      return stored && typeof stored === "object" ? {...defaults, ...stored} : defaults;
    } catch (_) { return defaults; }
  }

  function setForm(settings) {
    fields.forEach(id => {
      if (id === "visualEnabled") $(id).checked = !!settings[id];
      else $(id).value = settings[id] ?? "";
    });
    updateText(settings);
  }

  function updateText(settings) {
    $("previewText").textContent = settings.trackText.trim() || "Текст появится здесь";
  }

  function getVideoId(url) {
    try {
      const u = new URL(url);
      if (u.hostname === "youtu.be" || u.hostname.endsWith(".youtu.be")) {
        return u.pathname.split("/").filter(Boolean)[0] || "";
      }
      if (u.hostname.includes("youtube.com") || u.hostname.includes("youtube-nocookie.com")) {
        if (u.searchParams.get("v")) return u.searchParams.get("v");
        const parts = u.pathname.split("/").filter(Boolean);
        const marker = parts.findIndex(p => ["embed", "shorts", "live", "v"].includes(p));
        if (marker >= 0) return parts[marker + 1] || "";
      }
    } catch (_) {}
    return "";
  }

  function validRange(settings) {
    const start = Number(settings.startTime);
    const end = Number(settings.endTime);
    return Number.isFinite(start) && Number.isFinite(end) && start >= 0 && end > start;
  }

  function status(message) { $("status").textContent = message; }

  function stopLoopCheck() {
    if (loopTimer !== null) clearInterval(loopTimer);
    loopTimer = null;
  }

  function startLoopCheck() {
    stopLoopCheck();
    loopTimer = setInterval(() => {
      if (!playerReady || !lastSettings || !lastSettings.visualEnabled || !player) return;
      try {
        if (player.getPlayerState() !== YT.PlayerState.PLAYING) return;
        const end = Number(lastSettings.endTime);
        const start = Number(lastSettings.startTime);
        if (player.getCurrentTime() >= end - 0.08) {
          player.seekTo(start, true);
          player.playVideo();
        }
      } catch (_) {}
    }, 120);
  }

  function playFromStart() {
    if (!playerReady || !lastSettings) return;
    const start = Number(lastSettings.startTime);
    try {
      player.mute();
      if (lastSettings.visualEnabled) {
        player.seekTo(start, true);
        player.playVideo();
      } else {
        player.pauseVideo();
        player.seekTo(start, true);
      }
    } catch (_) {}
  }

  
function createPlayer(videoId) {
  currentVideoId = videoId;
  playerReady = false;

  const container = $("player");
  container.innerHTML = "";
  $("placeholder").style.display = "none";

  if (!window.YT || !YT.Player) {
    status("Загружается YouTube-плеер…");
    return;
  }

  stopLoopCheck();

  player = new YT.Player(container, {
    width: "100%",
    height: "100%",
    videoId,
    playerVars: {
      autoplay: 1,
      controls: 0,
      disablekb: 1,
      fs: 0,
      playsinline: 1,
      rel: 0,
      iv_load_policy: 3,
      mute: 1,
      start: Math.floor(Number(lastSettings.startTime) || 0),
      origin: location.origin
    },
    events: {
      onReady: event => {
        playerReady = true;
        event.target.mute();

        // Запрашиваем 480p, хотя YouTube может проигнорировать запрос.
        try {
          event.target.setPlaybackQuality("medium");
        } catch (_) {}

        playFromStart();
        startLoopCheck();

        status(
          lastSettings.visualEnabled
            ? "Видео воспроизводится без звука."
            : "Визуализация на паузе."
        );
      },

      onStateChange: event => {
        if (event.data === YT.PlayerState.PLAYING && player) {
          try {
            player.mute();
            player.setPlaybackQuality("medium");
          } catch (_) {}
        }
      },

      onError: () => {
        status(
          "Не удалось загрузить видео. Проверьте ссылку или ограничения встраивания."
        );
      }
    }
  });
}

    currentVideoId = videoId;
    playerReady = false;
    $("placeholder").style.display = "none";
    if (!window.YT || !YT.Player) {
      status("Загружается YouTube-плеер…");
      return;
    }
    if (player && typeof player.destroy === "function") {
      try { player.destroy(); } catch (_) {}
      player = null;
    }
    player = new YT.Player("player", {
      videoId,
      playerVars: {
        autoplay: 1, controls: 0, disablekb: 1, fs: 0, playsinline: 1,
        rel: 0, iv_load_policy: 3, modestbranding: 1, mute: 1,
        start: Math.floor(Number(lastSettings.startTime) || 0),
        origin: location.origin
      },
      events: {
        onReady: event => {
          playerReady = true;
          event.target.mute();
          playFromStart();
          startLoopCheck();
          status(lastSettings.visualEnabled ? "Видео воспроизводится без звука." : "Визуализация на паузе.");
        },
        onStateChange: event => {
          if (event.data === YT.PlayerState.PLAYING && player) {
            try { player.mute(); } catch (_) {}
          }
        },
        onError: () => status("Не удалось загрузить видео. Проверьте ссылку или ограничения встраивания.")
      }
    });
  }

  function applySettings(shouldSave = true) {
    const settings = readForm();
    updateText(settings);
    if (!validRange(settings)) {
      status("Проверьте диапазон: секунда «до» должна быть больше секунды «от».");
      return;
    }
    const videoId = getVideoId(settings.videoUrl);
    if (settings.videoUrl && !videoId) {
      status("Не удалось распознать ссылку. Подойдёт youtube.com/watch?v=… или youtu.be/…");
      return;
    }
    lastSettings = settings;
    applied = true;
    if (shouldSave) save(settings);

    if (!videoId) {
      if (player && typeof player.destroy === "function") {
        try { player.destroy(); } catch (_) {}
      }
      player = null; playerReady = false; currentVideoId = "";
      stopLoopCheck();
      $("placeholder").style.display = "grid";
      status("Ожидание ссылки на видео.");
      return;
    }
    if (!window.YT || !YT.Player) {
      $("placeholder").style.display = "grid";
      $("placeholder").textContent = "Загружается YouTube-плеер…";
      status("Загружается YouTube-плеер…");
      return;
    }
    if (videoId !== currentVideoId || !player) {
      createPlayer(videoId);
    } else if (playerReady) {
      try {
        player.mute();
        player.seekTo(Number(settings.startTime), true);
        if (settings.visualEnabled) player.playVideo();
        else player.pauseVideo();
        startLoopCheck();
        status(settings.visualEnabled ? "Видео воспроизводится без звука." : "Визуализация на паузе.");
      } catch (_) {}
    }
  }

  $("applyBtn").addEventListener("click", () => applySettings(true));
  $("resetBtn").addEventListener("click", () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
    lastSettings = {...defaults};
    setForm(defaults);
    applySettings(false);
    status("Настройки сброшены.");
  });

  $("visualEnabled").addEventListener("change", () => {
    const settings = readForm();
    lastSettings = settings;
    save(settings);
    updateText(settings);
    if (playerReady && player) {
      try {
        player.mute();
        if (settings.visualEnabled) {
          player.seekTo(Number(settings.startTime), true);
          player.playVideo();
          status("Видео воспроизводится без звука.");
        } else {
          player.pauseVideo();
          status("Визуализация на паузе.");
        }
      } catch (_) {}
    } else {
      status(settings.visualEnabled ? "Визуализация включена." : "Визуализация на паузе.");
    }
  });

  // Сохраняем текст и URL при редактировании; видео применяем кнопкой.
  ["videoUrl", "startTime", "endTime", "trackText"].forEach(id => {
    $(id).addEventListener("input", () => {
      const settings = readForm();
      save(settings);
      updateText(settings);
    });
  });

  // IFrame API загружается с YouTube; весь собственный CSS/JS находится в этом файле.
  window.onYouTubeIframeAPIReady = () => {
    if (applied && lastSettings && getVideoId(lastSettings.videoUrl)) applySettings(false);
  };
  const initial = load();
  setForm(initial);
  lastSettings = initial;
  const apiScript = document.createElement("script");
  apiScript.src = "https://www.youtube.com/iframe_api";
  apiScript.async = true;
  document.head.appendChild(apiScript);
  if (initial.videoUrl) {
    applied = true;
    $("placeholder").textContent = "Загружается YouTube-плеер…";
    status("Загружается YouTube-плеер…");
  }
})();
</script>
</body>
</html>
