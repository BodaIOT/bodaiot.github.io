<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход выполнен</title>
<style>
  :root {
    --bg: #262624;
    --surface: #30302e;
    --border: #45443f;
    --text: #eeece2;
    --text-muted: #a3a299;
    --accent: #d97757;
    --success: #4caf7d;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
  }

  .icon {
    width: 40px;
    height: 40px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: rgba(76, 175, 125, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon svg {
    width: 20px;
    height: 20px;
    color: var(--success);
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  p {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 24px;
  }

  a {
    display: inline-block;
    color: var(--accent);
    font-size: 13px;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Вход выполнен успешно</h1>
    <p>Теперь эта страница не содержит полей логина и пароля</p>
    <a href="TestPasswordInsert.html">Назад к форме</a>
  </div>

</body>
</html>
