<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Password Insert</title>
<style>
  :root {
    --bg: #262624;
    --surface: #30302e;
    --border: #45443f;
    --text: #eeece2;
    --text-muted: #a3a299;
    --accent: #d97757;
    --accent-hover: #c8674a;
    --success: #4caf7d;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 24px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--text);
    outline: none;
  }

  input:focus {
    border-color: var(--accent);
  }

  .password-field {
    position: relative;
  }

  .password-field input {
    padding-right: 40px;
  }

  .toggle-password {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: 6px;
    padding: 0;
    margin: 0;
    cursor: pointer;
    color: var(--text-muted);
  }

  .toggle-password:hover {
    color: var(--text);
    background: var(--border);
  }

  .toggle-password svg {
    width: 18px;
    height: 18px;
  }

  .toggle-password .eye-off {
    display: none;
  }

  button {
    margin-top: 8px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
  }

  button:hover {
    background: var(--accent-hover);
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Вход</h1>
    <p class="subtitle">Тестовая форма для проверки менеджера паролей</p>

    <form id="loginForm" autocomplete="on" action="success.html" method="GET">
      <div>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="username"
          autocomplete="username"
          placeholder="you@example.com"
          required
        >
      </div>

      <div>
        <label for="password">Пароль</label>
        <div class="password-field">
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          >
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Показать пароль">
            <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a21.8 21.8 0 0 1-3.22 4.36M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit">Войти</button>
    </form>
  </div>

  <script>
    // Переключатель видимости пароля
    var toggleBtn = document.getElementById('togglePassword');
    var passwordInput = document.getElementById('password');

    toggleBtn.addEventListener('click', function () {
      var isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleBtn.classList.toggle('is-visible', isHidden);
      toggleBtn.querySelector('.eye-on').style.display = isHidden ? 'none' : 'block';
      toggleBtn.querySelector('.eye-off').style.display = isHidden ? 'block' : 'none';
      toggleBtn.setAttribute('aria-label', isHidden ? 'Скрыть пароль' : 'Показать пароль');
    });

    // Форма "успешно логинится", переходя на отдельную статическую
    // страницу success.html — без реального бэкенда (GitHub Pages его
    // не поддерживает). Именно факт перехода на новую страницу, где
    // полей логина/пароля больше нет, и есть сигнал для менеджера
    // паролей, что вход прошёл успешно.
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault(); // не даём браузеру подставить логин/пароль в URL как query-параметры
      window.location.href = 'success.html';
    });
  </script>

</body>
</html>
