<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Password Insert</title>
<style>
  :root {
    --bg: #262624;
    --surface: #30302e;
    --border: #45443f;
    --text: #eeece2;
    --text-muted: #a3a299;
    --accent: #d97757;
    --accent-hover: #c8674a;
    --success: #4caf7d;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 24px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--text);
    outline: none;
  }

  input:focus {
    border-color: var(--accent);
  }

  button {
    margin-top: 8px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
  }

  button:hover {
    background: var(--accent-hover);
  }

  #status {
    margin-top: 16px;
    font-size: 13px;
    color: var(--text-muted);
    min-height: 18px;
  }

  #status.success {
    color: var(--success);
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Вход</h1>
    <p class="subtitle">Тестовая форма для проверки менеджера паролей</p>

    <form id="loginForm" autocomplete="on">
      <div>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="username"
          autocomplete="username"
          placeholder="you@example.com"
          required
        >
      </div>

      <div>
        <label for="password">Пароль</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          placeholder="••••••••"
          required
        >
      </div>

      <button type="submit">Войти</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var status = document.getElementById('status');
      status.textContent = 'Вход выполнен успешно';
      status.classList.add('success');
    });
  </script>

</body>
</html>
